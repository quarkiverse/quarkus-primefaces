<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                template="/template/layout.xhtml">

    <ui:define name="title">Something went wrong</ui:define>

    <ui:define name="content">
        <p>We could not complete your request. Please try again or return to the home page.</p>

        <h:panelGroup rendered="#{not empty pfExceptionHandler.message}">
            <p>Message: #{pfExceptionHandler.message}</p>
        </h:panelGroup>

        <p:button outcome="/index" value="Go to Homepage" icon="pi pi-home"/>
    </ui:define>

</ui:composition>
